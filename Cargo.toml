[package]
name = "yandex-music-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A polished unofficial Yandex Music TUI client"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shake-11/yandex-music-tui"
keywords = ["yandex-music", "tui", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12.15", default-features = false, features = ["native-tls", "stream"] }
rodio = { version = "0.19.0", default-features = false, features = ["mp3"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
toml = "0.8"
unicode-width = "0.2"
yamuse = { version = "0.3.2", default-features = false, features = ["native-tls"] }
