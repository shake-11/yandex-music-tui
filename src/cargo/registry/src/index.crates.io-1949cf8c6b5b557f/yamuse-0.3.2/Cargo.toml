path = "examples/device_auth.rs"

[[example]]
name = "download"
path = "examples/download.rs"
required-features = ["download"]

[[example]]
name = "drift"
path = "examples/drift.rs"

[[example]]
name = "library"
path = "examples/library.rs"

[[example]]
name = "lyrics"
path = "examples/lyrics.rs"

[[example]]
name = "now_playing"
path = "examples/now_playing.rs"
