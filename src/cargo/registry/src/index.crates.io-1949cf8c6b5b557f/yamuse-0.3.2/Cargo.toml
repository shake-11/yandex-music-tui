[dependencies.aes]
version = "0.8"

[dependencies.base64]
version = "0.22"

[dependencies.ctr]
version = "0.9"

[dependencies.futures-util]
version = "0.3"
features = ["std"]
optional = true
default-features = false

[dependencies.hex]
version = "0.4"

[dependencies.hmac]
version = "0.12"

[dependencies.md-5]
version = "0.10"

[dependencies.rand]
version = "0.9"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "stream",
    "charset",
    "http2",
]
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_path_to_error]
version = "0.1"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "time",
    "sync",
]
default-features = false

[dependencies.tokio-tungstenite]
version = "0.28"
features = [
    "connect",
    "rustls-tls-webpki-roots",
]
optional = true
default-features = false

[dependencies.tracing]
version = "0.1"
features = ["std"]
optional = true
default-features = false

[dependencies.uuid]
version = "1"
