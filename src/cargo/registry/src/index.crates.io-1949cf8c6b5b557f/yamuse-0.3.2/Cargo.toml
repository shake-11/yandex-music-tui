[package]
edition = "2024"
rust-version = "1.85"
name = "yamuse"
version = "0.3.2"
build = false
exclude = [
    ".github/",
    ".claude/",
    "docs/",
    "tests/fixtures/*.bin",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "typed async client for the yandex music api: catalogue, likes, playlists, radio, lossless downloads and ynison realtime"
homepage = "https://github.com/flxxxxddd/yamuse"
documentation = "https://docs.rs/yamuse"
readme = "README.md"
keywords = [
    "yandex",
    "music",
    "api",
    "client",
    "async",
]
categories = [
    "api-bindings",
    "multimedia::audio",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/flxxxxddd/yamuse"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = [
    "rustls-tls",
    "download",
]
download = [
    "tokio/fs",
    "tokio/io-util",
    "dep:futures-util",
]
full = [
    "download",
    "realtime",
    "tracing",
]
native-tls = ["reqwest/native-tls"]
realtime = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:uuid",
    "tokio/macros",
    "tokio/rt",
]
rustls-tls = ["reqwest/rustls-tls"]
tracing = ["dep:tracing"]

[lib]
name = "yamuse"
path = "src/lib.rs"

[[example]]
